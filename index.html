<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tofabiz Tasks - 효율적인 팀 업무 관리 시스템">
    <title>Tofabiz Tasks - 업무 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="logo">Tofabiz Tasks</h1>
                    <p class="subtitle">토파비즈 팀의 업무를 한눈에 관리하세요.</p>
                </div>
                <button id="addTaskBtn" class="btn-primary">
                    <span class="btn-icon">➕</span>
                    새 업무 추가
                </button>
            </div>
        </header>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card stat-card-blue">
                    <div class="stat-label">전체 업무</div>
                    <div class="stat-value" id="totalTasks">0</div>
                </div>
                <div class="stat-card stat-card-purple">
                    <div class="stat-label">진행 중</div>
                    <div class="stat-value" id="inProgressTasks">0</div>
                </div>
                <div class="stat-card stat-card-green">
                    <div class="stat-label">완료</div>
                    <div class="stat-value" id="completedTasks">0</div>
                </div>
            </div>
        </section>

        <!-- Tasks Table -->
        <section class="tasks-section">
            <div class="table-container">
                <table class="tasks-table">
                    <thead>
                        <tr>
                            <th class="col-name">업무명</th>
                            <th class="col-assignee">담당자</th>
                            <th class="col-date">회의날짜</th>
                            <th class="col-date">마감일</th>
                            <th class="col-priority">우선순위</th>
                            <th class="col-status">상태</th>
                            <th class="col-actions">관리</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <!-- Tasks will be rendered here -->
                    </tbody>
                </table>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p class="empty-text">아직 등록된 업무가 없습니다</p>
                    <p class="empty-subtext">새 업무를 추가하여 시작하세요!</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div id="modalOverlay" class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">새 업무 등록</h2>
                <button id="modalClose" class="modal-close">×</button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">업무명 *</label>
                    <input type="text" id="taskName" required placeholder="업무 내용을 입력하세요">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskAssignee">담당자 *</label>
                        <input type="text" id="taskAssignee" required placeholder="담당자명">
                    </div>
                    <div class="form-group">
                        <label for="taskMeetingDate">회의날짜</label>
                        <input type="date" id="taskMeetingDate">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDeadline">마감일</label>
                        <input type="date" id="taskDeadline">
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">우선순위</label>
                        <select id="taskPriority">
                            <option value="높음">높음</option>
                            <option value="중간" selected>중간</option>
                            <option value="낮음">낮음</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskStatus">상태</label>
                    <select id="taskStatus">
                        <option value="할 일" selected>할 일</option>
                        <option value="진행 중">진행 중</option>
                        <option value="완료">완료</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskImage">이미지 첨부 <span class="hint">(Ctrl+V로 붙여넣기 가능, 최대 1MB)</span></label>
                    <input type="file" id="taskImage" accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
